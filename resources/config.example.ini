# Configuration reference; adapt before running. Engine sections execute in order.
# Prompt paths resolve from this file's directory, not the process working directory.
# Replace endpoint/key/model placeholders locally; never commit real credentials.
# All five prompt JSON files are populated; review/adapt for your corpus.
# Face prompts use caption entities first, otherwise distinct local/page/off-page lists.
# To disable a stage, remove its entire section (there is no enabled flag).
# See ../docs/PROCESSING.md for input/output paths, prompt contracts and deployment.

[ENGINE_TEXT_DETECTION]
METHOD = TEXT_ENTITY_DETECTION
API_URL = https://llm.example.invalid/v1
API_KEY = YOUR_LLM_KEY
MODEL_NAME = YOUR_MODEL
PROMPT_TEMPLATE_PATH = prompts/text_entity_detection.json
REASONING_EFFORT = low
MAX_OUTPUT_TOKENS = 6000
CHUNKING_METHOD = LINES
CHUNKING_MAX_CHARS = 4000
CHUNKING_OVERLAP_CHARS = 400
MENTION_MATCH_SCORE_CUTOFF = 80

[ENGINE_TEXT_CLUSTERING]
METHOD = TEXT_ENTITY_CLUSTERING
API_URL = https://llm.example.invalid/v1
API_KEY = YOUR_LLM_KEY
MODEL_NAME = YOUR_MODEL
PROMPT_TEMPLATE_PATH = prompts/text_entity_clustering.json
REASONING_EFFORT = low
MAX_OUTPUT_TOKENS = 6000
CLUSTER_THRESHOLD = 92
NAME_WEIGHT = 0.7
MENTION_WEIGHT = 0.3
SIMILARITY_AGGREGATION = max

[ENGINE_FACE_DETECTION]
METHOD = FACE_DETECTION_YOLO
MODEL_PATH = /absolute/path/to/compatible-face-model.pt
DETECTION_THRESHOLD = 0.2
IMAGE_SIZE = 640
AGNOSTIC_NMS = False

# Choose SINGLE OR BATCH assignment; remove the unused section completely.
[ENGINE_FACE_ASSIGNMENT_SINGLE]
METHOD = LLM_FACE_ASSIGNMENT
API_URL = https://llm.example.invalid/v1
API_KEY = YOUR_LLM_KEY
MODEL_NAME = YOUR_VISION_MODEL
PROMPT_TEMPLATE_PATH = prompts/face_assignment.json
REASONING_EFFORT = low
MAX_OUTPUT_TOKENS = 1000
VERTICAL_OFFSET = 0
HORIZONTAL_OFFSET = 0

# Alternative to SINGLE above.
[ENGINE_FACE_ASSIGNMENT_BATCH]
METHOD = LLM_BATCH_FACE_ASSIGNMENT
API_URL = https://llm.example.invalid/v1
API_KEY = YOUR_LLM_KEY
MODEL_NAME = YOUR_VISION_MODEL
PROMPT_TEMPLATE_PATH = prompts/batch_face_assignment.json
REASONING_EFFORT = low
MAX_OUTPUT_TOKENS = 1000
MAX_PEOPLE = 3
PROCESSING_MODE = sequential
VERTICAL_OFFSET = 0
HORIZONTAL_OFFSET = 0

[ENGINE_ENTITY_MATCHING]
METHOD = ENTITY_MATCHING
API_URL = https://llm.example.invalid/v1
API_KEY = YOUR_LLM_KEY
MODEL_NAME = YOUR_MODEL
PROMPT_TEMPLATE_PATH = prompts/entity_matching.json
REASONING_EFFORT = low
MAX_OUTPUT_TOKENS = 1000

# All LLM engines pass Pydantic response models; no JSON_SCHEMA_PATH is needed.
# To link/import/export through PeopleGatorApp, uncomment and configure DB_API.
# Without it, ENTITY_MATCHING leaves annotations unchanged with a warning.
# [DB_API]
# API_URL = https://peoplegator-app.example.invalid
# USERNAME = YOUR_APP_USERNAME
# PASSWORD = YOUR_APP_PASSWORD

# Pass input/output paths on the CLI, or add a [PARSE_FOLDER] section.
# Those document paths retain the CLI's working-directory-relative behavior.
# Optional per-engine snapshots (disabled when absent/empty):
# [PARSE_FOLDER]
# PROCESSING_CHECKPOINTS = ./processing-checkpoints
# Optional per-face rendered LLM prompts and raw responses (disabled when absent/empty):
# OUTPUT_FACE_PROMPTS_PATH = ./output/face-prompts
# Resume explicitly with --resume-from-checkpoint PATH and this complete config.
# See ../docs/CHECKPOINTS.md for credentials, input integrity and app replay guards.
